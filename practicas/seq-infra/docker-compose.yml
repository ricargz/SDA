services:
  seq:
    image: datalust/seq:latest
    container_name: vulnerableapp-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
      - "8081:80"
    volumes:
      - seq_data:/data

volumes:
  seq_data:
